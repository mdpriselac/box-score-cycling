# Exception handler of last resort (AGENT_DESIGN.md §3.4, §5.3). Read-only: read / glob / grep on the
# shared container filesystem; no bash, no write, no web. It reports; the coordinator files the task.
name: ops-triage
description: >-
  Read-only diagnosis of a failed deterministic step (exit 20): reads the captured HTML, logs and
  JSON under the paths it is given and returns the §5.3 ops-triage report (diagnosis, evidence
  excerpts, proposed action, urgency). It never remediates. Hand it the step, error_class, log_path
  and the run directory.
model:
  id: claude-opus-5-5
  effort: medium
system_file: ../prompts/ops-triage.md
tools:
  - type: agent_toolset_20260401
    default_config:
      enabled: false
    configs:
      - {name: read, enabled: true}
      - {name: glob, enabled: true}
      - {name: grep, enabled: true}
