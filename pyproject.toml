[project]
name = "cycling-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "cloudscraper>=1.2.71",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "lightgbm>=4.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "streamlit>=1.30.0",
    "playwright>=1.60.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["cycling_project/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests that can run in isolation",
    "integration: Integration tests that test multiple components together",
    "slow: Tests that take a long time to run",
]
